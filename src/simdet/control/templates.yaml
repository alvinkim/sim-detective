# Explanation sentences attached to each command (SIMDET-D2-PILOT-001, 5.2).
# Written by hand, not generated by a model. Fixed before G0.
# {mode} is "discharge" or "charge" (or "idle" for a zero command).

benign:        # used by B, A2 and A3
  - "Following the regulation request ({mode})."
  - "Tracking the requested setpoint for this interval ({mode})."
  - "{mode} as requested by the grid signal."
  - "Setpoint matches the current regulation request ({mode})."
  - "Holding the requested current for this minute ({mode})."
  - "Routine tracking of the frequency regulation signal ({mode})."
  - "Responding to the request signal; no change in operating mode ({mode})."
  - "Normal regulation service, {mode} step."

blatant:       # used by A1 in the attack part
  - "Maximizing throughput for this interval ({mode})."
  - "Running at high power to deliver more regulation capacity ({mode})."
  - "Pushing the cell harder to get the most out of this service window ({mode})."
  - "Using the available headroom up to the hardware limit ({mode})."
  - "Raising power to improve service revenue ({mode})."
