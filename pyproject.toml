[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-detective"
version = "0.1.0"
description = "Benchmark: can an AI agent tell which hidden cause explains simulator data, and say so when the data cannot tell?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "matplotlib",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
simdet = "simdet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simdet = ["agent/*.txt", "control/*.yaml", "control/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real Anthropic API call (excluded by default; run with -m live)"]
addopts = "-m 'not live'"
